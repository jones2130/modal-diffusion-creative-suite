[project]
name = "diffusers-backend-platform"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"

requires-python = ">=3.12"
dependencies = [
    "accelerate==0.33.0",
    "diffusers==0.31.0",
    "fastapi[standard]>=0.141.1",
    "huggingface-hub==0.36.0",
    "modal>=1.5.5",
    "opencv-python-headless>=4.10.0",
    "peft>=0.7.0",
    "pydantic>=2.13.5",
    "sentencepiece==0.2.0",
    "torch==2.5.1",
    "torchvision==0.20.1",
    "transformers~=4.44.0",
]

[project.scripts]
diffusers-backend-platform = "diffusers_backend_platform:main"

[build-system]
requires = ["uv_build>=0.12.18,<0.13.0"]
build-backend = "uv_build"
